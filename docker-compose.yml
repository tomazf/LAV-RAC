services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://lavels:${POSTGRES_PASSWORD:?Nastavi POSTGRES_PASSWORD v .env}@db:5432/lavels
      TZ: Europe/Ljubljana
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lavels
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Nastavi POSTGRES_PASSWORD v .env}
      POSTGRES_DB: lavels
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lavels -d lavels"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional HTTPS with an automatic certificate: docker compose --profile https up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app

volumes:
  db-data:
  caddy-data:
