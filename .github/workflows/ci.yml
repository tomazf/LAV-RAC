name: CI
on:
  push:
    branches: [main]
    # documentation-only pushes do not run the tests (saves the free minutes)
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
# A newer push to the same branch cancels the older run; a run that hangs is stopped after 15 minutes (it took 4-6 minutes
# normally; without a limit a hung `npm test` used the 6-hour default of GitHub).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lav_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: PostgreSQL 17 tools for the backup tests (pg_dump must not be older than the server)
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/lav_test
          PG_BIN: /usr/lib/postgresql/17/bin
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the demo from the Compose file
        run: docker compose -f docker-compose.demo.yml up -d --build
      - name: The app must become healthy and show the login page
        run: |
          for i in $(seq 1 40); do curl -sf http://localhost:4000/healthz && break; sleep 3; done
          curl -sf http://localhost:4000/ | grep -qF "$(jq -r .title content/portal.json)"
          docker compose -f docker-compose.demo.yml ps
      - name: The image has the backup tools and they work against the database
        run: |
          docker compose -f docker-compose.demo.yml exec -T app sh -c 'pg_dump --version && pg_restore --version && psql --version'
          docker compose -f docker-compose.demo.yml exec -T app sh -c 'pg_dump --schema-only --format=custom --file=/tmp/t.dump "$DATABASE_URL" && pg_restore --list /tmp/t.dump | grep -q "TABLE public users"'
      - name: Validate the production Compose file
        run: |
          cp .env.example .env
          POSTGRES_PASSWORD=x docker compose --profile https config -q
      - if: failure()
        run: docker compose -f docker-compose.demo.yml logs
