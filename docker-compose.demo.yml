# Preview with a stand-in login. No Microsoft account needed. Not for real use.
# docker compose -f docker-compose.demo.yml up --build, then open http://localhost:3000
services:
  app:
    build: .
    command: ["node", "test/demo.js"]
    environment:
      DATABASE_URL: postgres://lavels:demo@db:5432/lavels
      TZ: Europe/Ljubljana
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:9400:9400"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lavels
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: lavels
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lavels -d lavels"]
      interval: 3s
      timeout: 3s
      retries: 20
